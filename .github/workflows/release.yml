# Builds the live CD and the disk image and publishes them as a GitHub
# release: on a pushed tag v*, or by hand (Actions > Release > Run workflow)
# with the tag to create.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag of the release (made on the chosen branch if it does not exist)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm
          # rust-toolchain.toml picks the toolchain, targets and rust-src.
          rustup show

      - name: Unit tests
        run: make check

      - name: Build
        run: make image iso

      - name: Package
        run: |
          mkdir -p dist
          cp build/justos.iso dist/justos.iso
          # The disk image (5 GiB, with Wine) is mostly empty: zipped it is
          # about 570 MiB, under GitHub's 2 GiB limit for a release file.
          (cd build && zip -9 ../dist/justos-img.zip justos.img)
          size=$(stat -c %s dist/justos-img.zip)
          if [ "$size" -ge 2147483648 ]; then
            echo "::error::justos-img.zip is $size bytes: over the 2 GiB a release file may have"
            exit 1
          fi
          (cd dist && sha256sum justos.iso justos-img.zip > SHA256SUMS)
          ls -l dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" \
              --title "justOS $TAG" --notes-file .github/release-notes.md
          fi
