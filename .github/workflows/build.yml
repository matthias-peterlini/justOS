# Builds and tests justOS on every push and pull request; the live CD and the
# disk image (compressed with xz) are kept as the run's artifacts for a week.
name: Build

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          sudo apt-get update
          # musl and MinGW build the Linux and Windows programs of test-compat.
          # OVMF is the UEFI firmware of the UEFI, live CD and update tests.
          sudo apt-get install -y nasm qemu-system-x86 musl-tools gcc-mingw-w64-x86-64 ovmf
          # rust-toolchain.toml picks the toolchain, targets and rust-src.
          rustup show

      - name: Unit tests
        run: make check

      - name: Build
        run: make image iso

      # The disk image has Wine and room for the C: drive it makes at its
      # first start: 5 GiB, of which about 1.8 GiB are data; xz makes it
      # about 325 MiB. The tests build and boot an image without Wine
      # (build/justos-test.img), so the trees with Wine go, to keep the
      # runner's disk free.
      - name: Compress the image
        run: |
          xz -T0 -6 build/justos.img
          rm -rf build/winelinux build/wineroot
          ls -l build/justos.img.xz
          df -h .

      - name: Test in QEMU
        run: |
          make test
          make test-compat

      # The rest of the suite: every test runs, and the step fails at the end
      # naming the ones that failed. VERBOSE=1 prints the session of every
      # failed case.
      - name: More tests in QEMU
        env:
          VERBOSE: "1"
        run: |
          failed=""
          for t in test-uefi test-iso test-drivers test-display test-acpi test-update test-linux test-wayland test-gtk; do
            echo "::group::$t"
            make $t || failed="$failed $t"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::failed:$failed"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: justos
          path: |
            build/justos.iso
            build/justos.img.xz
          retention-days: 7
