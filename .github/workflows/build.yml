# Builds and tests justOS on every push and pull request; the live CD and the
# disk image are kept as the run's artifacts for a week.
name: Build

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          sudo apt-get update
          # musl and MinGW build the Linux and Windows programs of test-compat;
          # MinGW also links just-stub, the runtime of justc's .exe programs.
          # OVMF is the UEFI firmware of the UEFI, live CD and update tests.
          sudo apt-get install -y nasm qemu-system-x86 musl-tools gcc-mingw-w64-x86-64 ovmf
          # rust-toolchain.toml picks the toolchain, targets and rust-src.
          rustup show

      - name: Unit tests
        run: make check

      - name: Build
        run: make image iso

      - name: Test in QEMU
        run: |
          make test
          make test-compat
          # JustScript: justc builds .jpk packages ("JPK\0"), and just, the
          # runner the system opens .jt and .jpk files with, runs them.
          make test-justscript

      # The rest of the suite: every test runs, and the step fails at the end
      # naming the ones that failed.
      - name: More tests in QEMU
        run: |
          failed=""
          for t in test-uefi test-iso test-drivers test-display test-acpi test-update test-linux test-wayland test-gtk; do
            echo "::group::$t"
            make $t || failed="$failed $t"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::failed:$failed"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: justos
          path: |
            build/justos.iso
            build/justos.img
          retention-days: 7
