[workspace]
resolver = "2"
members = ["kernel", "libs/*", "drivers/*", "apps/*", "store/*"]

[workspace.package]
version = "0.7.0"
edition = "2021"
publish = false
authors = ["Matthias Peterlini"]

[workspace.dependencies]
arcc-core = { path = "libs/arcc-core" }
arc-vm = { path = "libs/arc-vm" }
justdk = { path = "libs/justdk" }
justfs = { path = "libs/justfs" }
justgfx = { path = "libs/justgfx" }
justtls = { path = "libs/justtls" }
justzip = { path = "libs/justzip" }
justjson = { path = "libs/justjson" }
justweb = { path = "libs/justweb" }
justjs = { path = "libs/justjs" }
justui = { path = "libs/justui" }
justdrv = { path = "libs/justdrv" }
justrt = { path = "libs/justrt" }
justusb = { path = "libs/justusb" }
justvirtio = { path = "libs/justvirtio" }
justdex = { path = "libs/justdex" }
justaml = { path = "libs/justaml" }

[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_op_in_unsafe_fn = "warn"

[profile.dev]
panic = "abort"
opt-level = 1

[profile.release]
panic = "abort"
opt-level = 2
debug = false
codegen-units = 1
