# GTK 3 programs on justOS: justOS's look (the theme is in
# /usr/share/themes/justOS), its typeface, and no title bar buttons of
# their own (the desktop's frame has them).
[Settings]
gtk-theme-name=justOS
gtk-application-prefer-dark-theme=true
gtk-icon-theme-name=Adwaita
gtk-cursor-theme-name=Adwaita
gtk-font-name=Google Sans Flex 11
gtk-decoration-layout=:
gtk-dialogs-use-header=false
